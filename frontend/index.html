<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable web app: home-screen icon is a daily-return trigger. The FCM
         service worker (firebase-messaging-sw.js) stays the ONLY service worker —
         no caching SW is registered, so installability never touches push. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Marketing <head> values. The production build OVERWRITES title, description,
         og:*, twitter:* and canonical for every marketing route from
         src/marketing/seoContent.mjs (scripts/prerender-marketing.mjs) — that file is
         the source of truth, not this one. These are kept byte-identical to the landing
         page's values so the dev server, local OG previews and production all agree,
         and so nobody reads this file and believes the site describes itself
         differently than it does. src/marketing/seoContent.test.ts fails on drift, and
         also pins the attribute order the prerender script's regexes require: reorder
         these attributes and it silently appends a second tag instead of replacing. -->
    <meta name="description" content="Borderfall is a free, turn-based territory strategy game you play in your browser. Classic Risk-style conquest, except the world advances through the ages while you play it, from ancient legions to fleets among the stars." />
    <link rel="canonical" href="https://borderfall.gg/" />
    <meta property="og:site_name" content="Borderfall" />
    <meta property="og:title" content="Borderfall — Turn-Based Territory Strategy Across the Ages" />
    <meta property="og:description" content="Borderfall is a free, turn-based territory strategy game you play in your browser. Classic Risk-style conquest, except the world advances through the ages while you play it, from ancient legions to fleets among the stars." />
    <meta property="og:url" content="https://borderfall.gg/" />
    <!-- PNG is the primary social image: Twitter/X, Facebook, Discord, iMessage and
         LinkedIn don't reliably render SVG previews. Absolute URL is required by every
         platform. The source SVG is kept in the repo (public/og-image.svg). -->
    <meta property="og:image" content="https://borderfall.gg/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Borderfall — Turn-Based Territory Strategy Across the Ages" />
    <meta name="twitter:description" content="Borderfall is a free, turn-based territory strategy game you play in your browser. Classic Risk-style conquest, except the world advances through the ages while you play it, from ancient legions to fleets among the stars." />
    <meta name="twitter:image" content="https://borderfall.gg/og-image.png" />
    <title>Borderfall — Turn-Based Territory Strategy Across the Ages</title>
    <!-- Lightweight styling for the prerendered marketing HTML (injected into
         #root at build time by scripts/prerender-marketing.mjs). The SPA replaces
         #root on boot, so this only governs the brief pre-hydration paint and the
         no-JS crawler view. -->
    <style>
      .bf-prerender { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
      .bf-prerender h1 { font-family: Cinzel, Georgia, serif; color: #c9a84c; font-size: 2rem; margin: 0 0 .25rem; }
      .bf-prerender h2 { font-family: Cinzel, Georgia, serif; color: #c9a84c; font-size: 1.25rem; margin: 1.5rem 0 .5rem; }
      .bf-prerender p { color: #b6bdcc; line-height: 1.7; margin: 0 0 1rem; }
      .bf-prerender .bf-tagline { font-style: italic; color: #8892a4; }
      .bf-prerender .bf-era-list { color: #b6bdcc; line-height: 1.7; padding-left: 1.25rem; }
      .bf-prerender .bf-era-list li { margin: 0 0 .75rem; }
      .bf-prerender .bf-era-years { color: #8892a4; font-size: .9em; }
      .bf-prerender .bf-marketing-links { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .bf-prerender .bf-marketing-links a { color: #c9a84c; }
    </style>
    <!-- Google Fonts: Cinzel for display, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=optional" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=optional" rel="stylesheet" />
  </head>
  <body class="bg-bf-dark text-bf-text font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
