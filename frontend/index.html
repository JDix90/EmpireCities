<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable web app: home-screen icon is a daily-return trigger. The FCM
         service worker (firebase-messaging-sw.js) stays the ONLY service worker —
         no caching SW is registered, so installability never touches push. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Marketing <head> values. The production build OVERWRITES title, description,
         og:*, twitter:* and canonical for every marketing route from
         src/marketing/seoContent.mjs (scripts/prerender-marketing.mjs) — that file is
         the source of truth, not this one. These are kept byte-identical to the landing
         page's values so the dev server, local OG previews and production all agree,
         and so nobody reads this file and believes the site describes itself
         differently than it does. src/marketing/seoContent.test.ts fails on drift, and
         also pins the attribute order the prerender script's regexes require: reorder
         these attributes and it silently appends a second tag instead of replacing. -->
    <meta name="description" content="A free, turn-based territory strategy game in your browser. Risk-style conquest, except the world climbs through the ages as you play it." />
    <link rel="canonical" href="https://borderfall.gg/" />
    <meta property="og:site_name" content="Borderfall" />
    <meta property="og:title" content="Borderfall — Turn-Based Territory Strategy Across the Ages" />
    <meta property="og:description" content="A free, turn-based territory strategy game in your browser. Risk-style conquest, except the world climbs through the ages as you play it." />
    <meta property="og:url" content="https://borderfall.gg/" />
    <!-- PNG is the primary social image: Twitter/X, Facebook, Discord, iMessage and
         LinkedIn don't reliably render SVG previews. Absolute URL is required by every
         platform. The source SVG is kept in the repo (public/og-image.svg). -->
    <meta property="og:image" content="https://borderfall.gg/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Borderfall — Turn-Based Territory Strategy Across the Ages" />
    <meta name="twitter:description" content="A free, turn-based territory strategy game in your browser. Risk-style conquest, except the world climbs through the ages as you play it." />
    <meta name="twitter:image" content="https://borderfall.gg/og-image.png" />
    <title>Borderfall — Turn-Based Territory Strategy Across the Ages</title>
    <!-- Lightweight styling for the prerendered marketing HTML (injected into
         #root at build time by scripts/prerender-marketing.mjs). The SPA replaces
         #root on boot, so this only governs the brief pre-hydration paint and the
         no-JS crawler view. -->
    <style>
      .bf-prerender { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
      .bf-prerender h1 { font-family: Cinzel, Georgia, serif; color: #c9a84c; font-size: 2rem; margin: 0 0 .25rem; }
      .bf-prerender h2 { font-family: Cinzel, Georgia, serif; color: #c9a84c; font-size: 1.25rem; margin: 1.5rem 0 .5rem; }
      .bf-prerender p { color: #b6bdcc; line-height: 1.7; margin: 0 0 1rem; }
      .bf-prerender .bf-tagline { font-style: italic; color: #8892a4; }
      .bf-prerender .bf-era-list { color: #b6bdcc; line-height: 1.7; padding-left: 1.25rem; }
      .bf-prerender .bf-era-list li { margin: 0 0 .75rem; }
      .bf-prerender .bf-era-years { color: #8892a4; font-size: .9em; }
      .bf-prerender .bf-answer { color: #e8eaf0; font-size: 1.05rem; border-left: 3px solid #c9a84c; padding-left: 1rem; }
      .bf-prerender .bf-facts { margin: 0 0 1rem; }
      .bf-prerender .bf-facts dt { color: #8892a4; font-size: .9em; margin-top: .75rem; }
      .bf-prerender .bf-facts dd { color: #b6bdcc; margin: 0; }
      .bf-prerender .bf-faq dt { color: #e8eaf0; margin-top: 1rem; }
      .bf-prerender .bf-faq dd { color: #b6bdcc; margin: 0 0 .5rem; }
      .bf-prerender .bf-marketing-links { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .bf-prerender .bf-marketing-links a { color: #c9a84c; }
    </style>
    <!-- Cinzel for display, Inter for body: self-hosted (src/assets/fonts, SIL OFL,
         from Fontsource's variable builds) rather than fetched from Google at
         run time, which was a third-party request on every visit and a failure
         point where Google is blocked. Latin and latin-ext only, which covers
         every locale the game ships; latin-ext loads only when a page uses it.
         Vite hashes them into /assets, which nginx caches for a year.
         `font-display: optional` as before, so a slow font never shifts layout. -->
    <link rel="preload" href="./src/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/fonts/cinzel-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: optional; src: url(./src/assets/fonts/inter-latin-ext-wght-normal.woff2) format('woff2-variations'), url(./src/assets/fonts/inter-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: optional; src: url(./src/assets/fonts/inter-latin-wght-normal.woff2) format('woff2-variations'), url(./src/assets/fonts/inter-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 400 900; font-display: optional; src: url(./src/assets/fonts/cinzel-latin-ext-wght-normal.woff2) format('woff2-variations'), url(./src/assets/fonts/cinzel-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Cinzel'; font-style: normal; font-weight: 400 900; font-display: optional; src: url(./src/assets/fonts/cinzel-latin-wght-normal.woff2) format('woff2-variations'), url(./src/assets/fonts/cinzel-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    </style>
  </head>
  <body class="bg-bf-dark text-bf-text font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
