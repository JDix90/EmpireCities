name: CI
on:
  push:
    branches: [main]
  # Run for every PR regardless of base branch. Restricting to `branches: [main]`
  # meant stacked PRs (opened against another PR's branch) got no checks until
  # their base was retargeted to main — and a base change doesn't re-fire the
  # trigger, leaving the required checks stuck "Expected, never reported".
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch are wasted compute — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and dependency-free, so it reports in seconds rather than waiting on
  # the install/build jobs. A live Resend key once shipped in
  # .env.production.example and was harvested for phishing — this is the guard.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked files for committed credentials
        run: bash scripts/check-secrets.sh

  backend:
    runs-on: ubuntu-latest
    # NOTE: `services` is a JOB-level key. It was previously nested under the
    # "Backend tests" step, which made the whole workflow file invalid — every
    # run "failed" in 0s without executing anything, on every push since the
    # file was added.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Backs the PG_TEST integration tier below. Before this service existed
      # the six PG_TEST-gated files (auth multi-account, matchmaking, daily
      # guest, map moderation, spectator redaction, daily reconcile) skipped
      # on every CI run and only ever executed on a developer machine.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronouser
          POSTGRES_PASSWORD: chronopass
          POSTGRES_DB: borderfall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronouser -d borderfall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Connection settings shared by the migrate, seed and test steps. The
    # opt-in flags (REDIS_TEST / PG_TEST) stay on the test step itself so it is
    # obvious which run exercises the integration tiers.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: chronouser
      # Non-empty on purpose: config falls back to the docker-compose default
      # for an empty value, and the service above authenticates for real.
      POSTGRES_PASSWORD: chronopass
      POSTGRES_DB: borderfall
      REDIS_HOST: localhost
      REDIS_PASSWORD: ''
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -C packages/shared run build

      - name: Backend type-check
        run: pnpm -C backend exec tsc --noEmit

      # The PG_TEST tier runs against a migrated schema with the era and
      # community maps seeded — the same two commands the local throwaway
      # recipe in CLAUDE.md uses. Migrations are idempotent (tracked in the
      # `_migrations` table), so this is safe to re-run.
      - name: Migrate test database
        run: pnpm -C backend exec tsx src/db/postgres/migrate.ts

      - name: Seed maps into test database
        run: pnpm -C backend exec tsx ../database/seedMaps.ts

      - name: Backend tests
        run: pnpm run test:backend
        env:
          # Opt into the integration tiers. Unit tests mock Redis/Postgres and
          # need neither service; these flags switch on the files that talk to
          # the real ones (redisGameStore.test.ts for Redis; the six
          # PG_TEST-gated files, and spectatorRedaction which needs both).
          REDIS_TEST: '1'
          PG_TEST: '1'

      - name: Validate maps
        run: pnpm run validate:maps

      - name: ESLint (backend)
        run: pnpm run lint:backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm -C packages/shared run build

      - name: Frontend type-check
        run: pnpm -C frontend exec tsc --noEmit

      - name: ESLint (frontend)
        run: pnpm run lint:frontend

      - name: Frontend unit tests
        run: pnpm run test:frontend

      # VITE_LAB_ROUTES exposes the /__modal-lab and /__map-visual-lab QA
      # harnesses that the map-visual and modal specs drive. It is set ONLY here
      # — the production image (docker/Dockerfile.frontend) never passes it, so
      # those routes do not exist in a shipped build.
      - name: Frontend build
        env:
          VITE_LAB_ROUTES: '1'
        run: pnpm -C frontend run build

      - name: Install Playwright (Chromium)
        run: pnpm -C frontend exec playwright install chromium --with-deps

      # Playwright self-hosts the built app via `vite preview` (see webServer
      # in frontend/playwright.config.ts), so these need the build above.
      - name: E2E smoke (Chromium)
        env:
          CI: true
        run: pnpm run test:e2e:smoke

      - name: E2E map visual smokes (Chromium)
        env:
          CI: true
        run: pnpm run test:e2e:map-visual
