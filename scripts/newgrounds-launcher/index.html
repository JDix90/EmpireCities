<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Borderfall</title>
<!--
  Borderfall launcher for Newgrounds' HTML5 player.

  Newgrounds hosts this file and runs it inside an iframe on the submission
  page. Borderfall itself is a full-stack app (Postgres, Redis, sockets), so it
  cannot be uploaded as a static build — this shell frames the live site
  instead. Same approach as scripts/itch-launcher, different origins and UTM.

  IT MUST NEVER BUST OUT OF ITS FRAME. No top.location, no parent.location, no
  auto-redirect. Navigating the player away from Newgrounds is hostile to the
  platform and to the person who pressed play. The only way out of here is a
  link the visitor chooses to click.

  Framing only works once borderfall.gg's frame-ancestors AND EMBED_ORIGINS
  name every Newgrounds origin in the ancestor chain (docker/portals.json →
  `pnpm -C backend exec tsx scripts/syncPortals.ts`; see docs/PORTALS.md).
  Until they do, the CSP blocks the frame and this page shows a "play in a new
  tab" fallback instead — so the submission is useful on day one and upgrades
  itself the moment the server side is switched on, with no re-upload.

  THE CHICKEN AND EGG: we cannot add those origins to the registry until we
  know them, and they are only observable from inside this player. So this
  shell reports them three ways (see #origins below): in the fallback panel, on
  the console, and on demand via the #setup hash. Read them off the live
  submission, put those exact values in docker/portals.json, sync, deploy —
  then this shell starts framing on its own, with no re-upload.

  THE APP SAYS SO; WE DO NOT GUESS. From the parent you cannot tell a loaded
  cross-origin frame from a browser error page — reading
  `contentWindow.location.href` throws SecurityError for BOTH — so this shell
  no longer infers. borderfall.gg posts {source:'borderfall',
  type:'embed-ready'} once it has actually rendered (notifyEmbedderReady in
  frontend/src/utils/embedContext.ts) and that message is the only thing that
  counts as playing. The escape link stays visible anyway, so a visitor whose
  frame is technically alive but unusable still has a way out.

  DEPLOY ORDER MATTERS: silence is now failure. Ship borderfall.gg with the
  handshake FIRST, then upload this shell — an app build without it would make
  this page cover a perfectly working game with the fallback. See README.md.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0f1117; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #c8cbd4;
    overflow: hidden;
  }
  #game {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #0f1117;
  }
  /* Sits over the frame until the game paints, then gets hidden. */
  #panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: #0f1117;
  }
  #panel[hidden] { display: none; }
  .mark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: .06em;
    color: #d4a843;
    margin: 0;
  }
  .sub { font-size: 14px; color: #8a90a0; margin: 0; max-width: 34ch; line-height: 1.5; }
  .cta {
    display: inline-block; margin-top: 4px;
    padding: 12px 22px; border-radius: 10px;
    background: #d4a843; color: #14161d;
    font-weight: 700; font-size: 15px; text-decoration: none;
  }
  .cta:hover { background: #e2ba5c; }
  /* Not optional. Without it the author rule above wins over the UA
     stylesheet's `[hidden] { display: none }` — author origin beats UA origin
     whatever the specificity — so the fallback button paints inside the
     loading panel on every single load: the failure UI, shown while nothing
     has failed. Every other element toggled by `hidden` here needs its own
     rule for the same reason. */
  #cta[hidden] { display: none; }
  .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  /* Always reachable, even if the frame loaded but is unusable. */
  #escape {
    position: absolute; right: 10px; bottom: 10px; z-index: 2;
    padding: 7px 12px; border-radius: 999px;
    background: rgba(15, 17, 23, .82);
    border: 1px solid rgba(212, 168, 67, .4);
    color: #d4a843; font-size: 12px; text-decoration: none;
    backdrop-filter: blur(4px);
  }
  #escape[hidden] { display: none; }
  #escape:hover { background: rgba(15, 17, 23, .95); }
  /* Setup diagnostic. Only ever shown when the frame was refused, which for a
     visitor is already the error state — so this adds no noise to a working
     submission. Small and muted: it is for the developer, not the player. */
  #origins {
    margin-top: 10px; max-width: 46ch;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #6f7686; text-align: left;
    border-top: 1px solid #23262f; padding-top: 8px;
    word-break: break-all;
  }
  #origins[hidden] { display: none; }
  #origins b { color: #8a90a0; font-weight: 600; }
</style>
</head>
<body>

<iframe
  id="game"
  title="Borderfall"
  src="https://borderfall.gg/?utm_source=newgrounds&utm_medium=embed"
  allow="fullscreen; clipboard-write"
  referrerpolicy="origin-when-cross-origin"
></iframe>

<div id="panel">
  <p class="mark">BORDERFALL</p>
  <p class="sub" id="msg"><span class="dots">Loading</span></p>
  <a class="cta" id="cta" href="https://borderfall.gg/?utm_source=newgrounds&utm_medium=newtab"
     target="_blank" rel="noopener noreferrer" hidden>Play in a new tab</a>
  <div id="origins" hidden></div>
</div>

<a id="escape" href="https://borderfall.gg/?utm_source=newgrounds&utm_medium=newtab"
   target="_blank" rel="noopener noreferrer" hidden>Open in a new tab &#8599;</a>

<script>
  (function () {
    var panel = document.getElementById('panel');
    var msg = document.getElementById('msg');
    var cta = document.getElementById('cta');
    var escapeLink = document.getElementById('escape');
    var originsBox = document.getElementById('origins');
    var frame = document.getElementById('game');
    var settled = false;

    /* The app's origin. A handshake claiming to be Borderfall from anywhere
       else is not Borderfall. */
    var APP_ORIGIN = 'https://borderfall.gg';
    /* After the frame's own load event, how long a working app still has to
       announce itself. Generous because the app may be fetching a language
       chunk before it first renders. */
    var GRACE_AFTER_LOAD_MS = 6000;
    /* Backstop for a frame whose load event never fires at all. */
    var HARD_DEADLINE_MS = 12000;

    var chain = ancestorChain();
    var setupMode = location.hash === '#setup';
    window.__borderfallOrigins = chain;
    try {
      console.info('[borderfall] add these origins to docker/portals.json:', chain.join(' '));
    } catch (e) {}

    /*
     * Every origin that will be an ANCESTOR of the borderfall.gg frame, from
     * the immediate parent outward. `frame-ancestors` and EMBED_ORIGINS must
     * name all of them, not just the page the visitor sees.
     */
    function ancestorChain() {
      var out = [];
      try { if (location.origin && location.origin !== 'null') out.push(location.origin); } catch (e) {}
      try {
        var a = location.ancestorOrigins;
        if (a) { for (var i = 0; i < a.length; i++) out.push(a[i]); }
        else if (document.referrer) { out.push(new URL(document.referrer).origin); }
      } catch (e) {}
      return out.filter(function (o, i) { return o && out.indexOf(o) === i; });
    }

    function showOrigins() {
      /* Guarded: a shell missing this element must still show its fallback.
         A throw here would leave the visitor with no way out at all. */
      if (!originsBox || !chain.length) return;
      originsBox.innerHTML = '<b>Setup — add these to docker/portals.json:</b><br>'
        + chain.map(function (o) { return '&nbsp;&nbsp;' + o; }).join('<br>');
      originsBox.hidden = false;
    }

    function playing() {
      if (settled) return;
      settled = true;
      escapeLink.hidden = false;
      if (setupMode) { msg.textContent = 'Setup mode.'; showOrigins(); return; }
      panel.hidden = true;
    }

    function blocked() {
      if (settled) return;
      settled = true;
      msg.textContent = 'This page could not load the game in place. '
        + 'It runs fine in its own tab — free, no download, no account.';
      cta.hidden = false;
      escapeLink.hidden = true; /* the big button is right there; two would be noise */
      showOrigins();
    }

    /*
     * THE HANDSHAKE, and why the old inference is gone.
     *
     * From here you cannot distinguish a loaded cross-origin frame from a
     * browser error page: reading `contentWindow.location.href` throws
     * SecurityError for BOTH. An earlier version of this shell treated the
     * throw as success, so a frame refused by `frame-ancestors` — which fails
     * with ERR_BLOCKED_BY_RESPONSE and lands on chrome-error://chromewebdata/
     * — was reported as "playing", and this fallback stayed hidden. On
     * Newgrounds that showed visitors Chrome's "refused to connect" page
     * instead of a working button.
     *
     * So the app asserts instead of us guessing: borderfall.gg posts
     * {source:'borderfall', type:'embed-ready'} once it has actually rendered
     * (notifyEmbedderReady in frontend/src/utils/embedContext.ts). A message
     * that arrives is proof the bundle ran; nothing else can send it.
     *
     * DEPLOY ORDER MATTERS. Silence is now treated as failure, so an app build
     * without the handshake would make this shell show the fallback over a
     * game that works. Deploy borderfall.gg FIRST, then upload this shell.
     * See scripts/newgrounds-launcher/README.md.
     */
    window.addEventListener('message', function (e) {
      if (settled) return;
      if (e.source !== frame.contentWindow) return;   /* not from our frame */
      if (e.origin !== APP_ORIGIN) return;            /* not from the app */
      var d = e.data;
      if (!d || d.source !== 'borderfall' || d.type !== 'embed-ready') return;
      playing();
    });

    /* The load event settles nothing on its own — it fires for the error page
       too. It only starts the shorter clock, because by then a working app is
       nearly always already through. */
    frame.addEventListener('load', function () {
      window.setTimeout(blocked, GRACE_AFTER_LOAD_MS);
    });
    frame.addEventListener('error', blocked);
    window.setTimeout(blocked, HARD_DEADLINE_MS);
  })();
</script>

</body>
</html>
