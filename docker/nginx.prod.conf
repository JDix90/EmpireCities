# Same-origin deployment: browser talks to one HTTPS host; nginx forwards API + Socket.io to Node.
# For split domains (static on CDN, API elsewhere), build the frontend with VITE_API_URL / VITE_SOCKET_URL instead.
#
# Horizontal scaling (Phase 9): uncomment the second backend server and enable ip_hash so
# WebSocket clients stick to one Node instance for the life of their connection.

# Preserve the client's original scheme for backend-built absolute URLs (OG
# preview og:image / og:url). TLS is terminated in front of nginx, so the real
# scheme arrives via X-Forwarded-Proto; nginx's own $scheme is just http on :80.
# Default to https when the header is absent (production always sits behind TLS).
map $http_x_forwarded_proto $forwarded_proto_or_https {
    ""      https;
    default $http_x_forwarded_proto;
}

upstream borderfall_api {
    ip_hash;
    server backend:3001;
    # server backend_2:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects (`Location: /answers/`) instead of absolute ones.
    # nginx builds an absolute redirect from the scheme IT sees, and TLS is
    # terminated in front of us — so on :80 it saw http and sent crawlers
    # `http://borderfall.gg/answers/` for the trailing-slash redirect on every
    # prerendered directory page (/answers, /how-to-play, /eras, …). That is an
    # extra http→https hop on exactly the pages we want indexed. Relative
    # Location keeps the client's own scheme and is valid per RFC 7231 §7.1.2.
    absolute_redirect off;

    # Who may put this document in an iframe.
    #
    # There was no Content-Security-Policy on the static responses at all
    # before this, so framing rested entirely on `X-Frame-Options`, which the
    # TLS-terminating layer in front of nginx adds. An explicit allowlist is
    # strictly tighter than that, and unlike XFO it can name an origin, which
    # is the only way to let a game portal embed the game.
    #
    # `frame-ancestors` is checked against EVERY ancestor in the chain, not
    # just the immediate parent, so embedding on itch needs all of them:
    #
    #   <user>.itch.io          the project page (the top-level window)
    #   *.itch.zone             the sandboxed player that holds our launcher
    #
    # Naming only the player origin is why the first attempt was refused: the
    # project page sits above it and failed the check. itch's own site-locking
    # guidance recommends `*.itch.zone` because the player subdomain varies.
    # Delete the two itch entries and the policy is just 'self' again — that
    # one edit is the off switch.
    #
    # NOTE this is only half the story. XFO has no allowlist (SAMEORIGIN or
    # DENY only) and browsers honour it alongside CSP, so framing stays blocked
    # until `X-Frame-Options` STOPS BEING SENT by the layer in front of nginx.
    # That layer is not in this repository. See scripts/itch-launcher/README.md.
    #
    # Server level so every location inherits it; nothing here sets its own
    # add_header, which would otherwise drop inherited ones. Proxied /api
    # responses also carry helmet's CSP — two policies are enforced as their
    # intersection, which is harmless because API responses are not framed.
    add_header Content-Security-Policy "frame-ancestors 'self' https://itch.io https://*.itch.io https://*.itch.zone;" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SECURITY: set X-Forwarded-For to $remote_addr (OVERWRITE), never
    # $proxy_add_x_forwarded_for (APPEND). The backend runs Fastify with a
    # bounded trustProxy (1 hop) and derives request.ip — and the HTTP rate-limit
    # key — from X-Forwarded-For. Appending preserves any client-sent value as
    # the left-most entry, which a client can forge to rotate its rate-limit
    # bucket (bypassing login/register/guest/forgot-password limits). Overwriting
    # discards the client value so request.ip is the real connecting address. If
    # you add another trusted proxy in front of nginx, raise TRUST_PROXY to match.
    location /health {
        proxy_pass http://borderfall_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ready {
        proxy_pass http://borderfall_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://borderfall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://borderfall_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Map Hub SPA (/maps) vs static regional JSON under /maps/regional/*.json
    # Without these, try_files hits the public/maps/ directory and returns 403.
    location = /maps {
        expires -1;
        try_files /index.html =404;
    }
    location = /maps/ {
        expires -1;
        try_files /index.html =404;
    }
    location ^~ /maps/ {
        expires -1;
        try_files $uri /index.html;
    }

    # Replay links: serve the SPA to humans, but route social/chat crawler
    # user-agents to the backend HTML shell so link unfurls get per-replay
    # Open Graph tags + a dynamic preview image. `if` + `proxy_pass` is one of
    # the documented-safe uses of `if` in location context.
    location ~ ^/replay/[^/]+$ {
        # Header directives live in the location so they're inherited by the
        # implicit `if` location below. The backend builds og:image / og:url
        # from these, so Host + the *original* X-Forwarded-Proto must survive
        # (don't overwrite proto with $scheme — TLS is terminated upstream and
        # nginx itself only sees http on :80). Fall back to https when absent.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_or_https;
        if ($http_user_agent ~* "(facebookexternalhit|Twitterbot|Slackbot|Discordbot|LinkedInBot|WhatsApp|TelegramBot|Embedly|Pinterest|redditbot|Googlebot|bingbot|Applebot|vkShare|SkypeUriPreview|Bitrix|nuzzel|Slack-ImgProxy|flipboard|tumblr|bitlybot|mattermost|Iframely)") {
            proxy_pass http://borderfall_api;
        }
        try_files /index.html =404;
    }

    # Daily archive: settled puzzles are public, crawlable pages (one per day).
    # Same crawler/human split as /replay above, but for a different reason —
    # these pages exist to be indexed and cited, not just to unfurl, so the UA
    # list adds the AI answer-engine crawlers on top of the social/search ones.
    # (Google-Extended and Applebot-Extended are robots.txt opt-out tokens, not
    # user-agent strings, so they are deliberately absent here.)
    #
    # The backend renders the same puzzle, objective and results table the SPA
    # shows from the same public API — parity is what keeps dynamic serving from
    # being cloaking, and the backend sends Vary: User-Agent.
    # The regex MUST stay quoted: nginx's config lexer treats an unquoted `{`
    # as the start of the location block, so `[0-9]{4}` truncates the pattern
    # to `^/daily/(archive|[0-9]`, pcre2_compile() then fails on the unclosed
    # group, and nginx REFUSES TO START — taking the whole site down, static
    # assets included, not just this route.
    location ~ "^/daily/(archive|[0-9]{4}-[0-9]{2}-[0-9]{2})$" {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_or_https;
        if ($http_user_agent ~* "(Googlebot|bingbot|Applebot|DuckDuckBot|YandexBot|Baiduspider|GPTBot|OAI-SearchBot|ChatGPT-User|PerplexityBot|Perplexity-User|ClaudeBot|Claude-Web|anthropic-ai|Amazonbot|CCBot|cohere-ai|meta-externalagent|Bytespider|DuckAssistBot|YouBot|Diffbot|Timpibot|omgili|facebookexternalhit|Twitterbot|Slackbot|Discordbot|LinkedInBot|WhatsApp|TelegramBot|Embedly|Pinterest|redditbot|vkShare|SkypeUriPreview|mattermost|Iframely)") {
            proxy_pass http://borderfall_api;
        }
        try_files /index.html =404;
    }

    # The daily archive grows by one URL a day, which the checked-in
    # sitemap.xml cannot express. robots.txt points crawlers here.
    location = /sitemap-daily.xml {
        proxy_pass http://borderfall_api/api/daily/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_or_https;
    }

    # PWA manifest: nginx's stock mime.types has no .webmanifest mapping, and
    # a text/plain manifest breaks installability checks in some browsers.
    location = /manifest.webmanifest {
        # Its own `=` location, so it inherits from the server level and not
        # from `location /` — the expires below has to be repeated here.
        expires -1;
        types { }
        default_type application/manifest+json;
    }

    # Content-hashed bundles (Vite emits `index-Bnj9umAK.js`, `index-B4oZY5II.css`
    # — the hash changes whenever the bytes do). Safe to cache for a year; a
    # deploy publishes new filenames rather than new contents at the same URL.
    # `frontend/public/` has no `assets/` directory, so nothing else lands here.
    #
    # Vite's default output names are all hashed here — vite.config.ts
    # customises only `manualChunks`, not `assetFileNames`/`entryFileNames` —
    # so there is nothing under /assets that changes in place.
    #
    # `=404` so a missing bundle fails as a missing bundle: the catch-all below
    # would otherwise answer with index.html, and a <script> that receives
    # text/html fails with a MIME-type error that looks nothing like the 404 it
    # is. `^~` stops regex evaluation — no regex location here matches /assets
    # today, so it changes nothing now and keeps it that way if one is added.
    #
    # No `immutable`: that would mean `add_header Cache-Control ...`, and an
    # add_header at this level drops the inherited CSP above. A year of
    # freshness is the part that matters; `immutable` only changes what an
    # explicit reload does.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # `$uri/index.html`, NOT `$uri/`. The `$uri/` form makes nginx answer a
        # directory request with a 301 to the same path plus a trailing slash,
        # so every prerendered page (/answers, /answers/*, /how-to-play, /eras,
        # /about, /privacy, /terms) was served only after a redirect — while its
        # own <link rel="canonical"> and its sitemap entry both name the
        # slash-less URL. The canonical therefore pointed at a URL that
        # redirected away from the canonical, which is the kind of
        # inconsistency Bing leaves sitting in "discovered but not crawled".
        # Serving the file directly makes the sitemap URL, the served URL and
        # the canonical the same string. The slash variant still resolves.
        #
        # `expires -1` sends `Cache-Control: no-cache`, which means "store it,
        # but revalidate before reuse" — not "don't store". With the ETag
        # already on these responses that costs one conditional GET and returns
        # an empty 304 until the bytes actually change.
        #
        # Nothing here set any Cache-Control before, so browsers fell back to
        # RFC 9111 heuristic freshness (~10% of the document's age) and reused
        # index.html without asking. Two consequences, both real: a deploy took
        # hours to reach an open tab, and — because response headers travel with
        # the cached response — so did a header change, which is what made the
        # itch embed keep failing against a `frame-ancestors` value nginx had
        # already stopped sending. A stale shell also outlives the hashed
        # bundles it names, since a deploy replaces /assets wholesale.
        #
        # Use `expires`, NOT `add_header Cache-Control`. add_header only
        # inherits into a location that declares no add_header of its own, so
        # setting one here would silently drop the server-level CSP above and
        # break framing again. `expires` is a separate directive and inherits
        # independently.
        expires -1;
        try_files $uri $uri/index.html /index.html;
    }
}
